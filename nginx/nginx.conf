# Which reverse proxies are trusted for the client's address and scheme (#256),
# and $fwd_proto. Written by entrypoint.sh from TRUSTED_PROXIES.
include /var/cache/nginx/proxy-trust.conf;

# HTTP: redirects to HTTPS, or serves the app when TLS_MODE=proxy (a reverse
# proxy in front terminates TLS). Which one is written by entrypoint.sh.
server {
    listen 80;
    # [::]:80 where the kernel has IPv6 (#231); written by entrypoint.sh.
    include /var/cache/nginx/listen-v6-http.conf;
    server_name _;
    include /var/cache/nginx/http-mode.conf;
}

# HTTPS
server {
    listen 443 ssl;
    include /var/cache/nginx/listen-v6-https.conf;
    server_name _;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/mtm-app.conf;
}
