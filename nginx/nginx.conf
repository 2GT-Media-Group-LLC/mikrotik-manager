# Which reverse proxies are trusted for the client's address and scheme (#256),
# and $fwd_proto. Written by entrypoint.sh from TRUSTED_PROXIES.
include /var/cache/nginx/proxy-trust.conf;

upstream mtm_backend {
    include /var/cache/nginx/backend-upstream.conf;
}

# HTTP: redirects to HTTPS in https mode and serves the app in proxy or http mode.
server {
    listen 80;
    # [::]:80 where the kernel has IPv6 (#231); written by entrypoint.sh.
    include /var/cache/nginx/listen-v6-http.conf;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/cache/nginx/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    include /var/cache/nginx/http-mode.conf;
}

# Enabled in https and proxy modes.
include /var/cache/nginx/https-mode.conf;
