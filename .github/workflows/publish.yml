name: Publish to GHCR

# Images are built only from a commit that passed CI. This used to run on every
# push to main, in parallel with CI, so a commit that failed its tests was still
# published as :latest, and anyone running the documented update command pulled
# it. (The release trigger never fired: releases are created with the workflow
# token, which does not start other workflows.)
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    # main is the stable line (:latest); dev carries the next minor's betas (:beta).
    branches: [main, dev]
  workflow_dispatch:

# One queue per branch: a dev build waiting behind a main build used to
# replace (cancel) it, leaving :latest a commit behind.
concurrency:
  group: publish-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/2gt-media-group-llc/mikrotik-manager-backend
  NGINX_IMAGE: ghcr.io/2gt-media-group-llc/mikrotik-manager-nginx

jobs:
  publish-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign proves the image came from this workflow.
      id-token: write

    steps:
      - name: Checkout the commit CI tested
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # :latest (main) or :beta (dev) only moves if this commit is still the tip
      # of its branch, so a slow CI run for an older commit can't publish over a
      # newer one. Every build also gets its version tag, which can be pinned.
      - name: Work out tags
        id: tags
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          echo "version=$(node -p "require('./backend/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          # The moving tag follows the branch: main -> :latest, dev -> :beta.
          # Only the tip of that branch moves it, so a slow run can't go back.
          TIP=$(git ls-remote "https://github.com/${{ github.repository }}" "refs/heads/$BRANCH" | cut -f1)
          LATEST=false; BETA=false
          if [ "$TIP" = "$SHA" ]; then
            if [ "$BRANCH" = "main" ]; then LATEST=true; elif [ "$BRANCH" = "dev" ]; then BETA=true; fi
          fi
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "beta=$BETA" >> "$GITHUB_OUTPUT"
          # The version tag belongs to main, or to dev once it carries a beta
          # version; right after a release dev has main's version, and its
          # build would take the tag over.
          VERSION_TAG=false
          case "$BRANCH" in main) VERSION_TAG=true ;; esac
          case "$(node -p "require('./backend/package.json').version")" in *beta*) VERSION_TAG=true ;; esac
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ steps.tags.outputs.latest }}
            type=raw,value=beta,enable=${{ steps.tags.outputs.beta }}
            type=raw,value=${{ steps.tags.outputs.version }},enable=${{ steps.tags.outputs.version_tag }}
            type=raw,value=sha-${{ steps.tags.outputs.short }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # An SBOM and build provenance attached to the image (outside review O2).
          sbom: true
          provenance: mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signed by digest, so a tag moved later can't borrow the signature.
      # Verify with:
      #   cosign verify ghcr.io/2gt-media-group-llc/mikrotik-manager-backend@<digest> \
      #     --certificate-identity-regexp 'https://github.com/2GT-Media-Group-LLC/mikrotik-manager/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${{ env.BACKEND_IMAGE }}@${DIGEST}"

  publish-nginx:
    name: Build & Push Nginx (Frontend)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign proves the image came from this workflow.
      id-token: write

    steps:
      - name: Checkout the commit CI tested
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # :latest (main) or :beta (dev) only moves if this commit is still the tip
      # of its branch, so a slow CI run for an older commit can't publish over a
      # newer one. Every build also gets its version tag, which can be pinned.
      - name: Work out tags
        id: tags
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          echo "version=$(node -p "require('./backend/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          # The moving tag follows the branch: main -> :latest, dev -> :beta.
          # Only the tip of that branch moves it, so a slow run can't go back.
          TIP=$(git ls-remote "https://github.com/${{ github.repository }}" "refs/heads/$BRANCH" | cut -f1)
          LATEST=false; BETA=false
          if [ "$TIP" = "$SHA" ]; then
            if [ "$BRANCH" = "main" ]; then LATEST=true; elif [ "$BRANCH" = "dev" ]; then BETA=true; fi
          fi
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "beta=$BETA" >> "$GITHUB_OUTPUT"
          # The version tag belongs to main, or to dev once it carries a beta
          # version; right after a release dev has main's version, and its
          # build would take the tag over.
          VERSION_TAG=false
          case "$BRANCH" in main) VERSION_TAG=true ;; esac
          case "$(node -p "require('./backend/package.json').version")" in *beta*) VERSION_TAG=true ;; esac
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.NGINX_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ steps.tags.outputs.latest }}
            type=raw,value=beta,enable=${{ steps.tags.outputs.beta }}
            type=raw,value=${{ steps.tags.outputs.version }},enable=${{ steps.tags.outputs.version_tag }}
            type=raw,value=sha-${{ steps.tags.outputs.short }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: nginx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # An SBOM and build provenance attached to the image (outside review O2).
          sbom: true
          provenance: mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signed by digest, so a tag moved later can't borrow the signature.
      # Verify with:
      #   cosign verify ghcr.io/2gt-media-group-llc/mikrotik-manager-nginx@<digest> \
      #     --certificate-identity-regexp 'https://github.com/2GT-Media-Group-LLC/mikrotik-manager/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${{ env.NGINX_IMAGE }}@${DIGEST}"
