name: Publish to GHCR

# Images are built only from a commit that passed CI. This used to run on every
# push to main, in parallel with CI, so a commit that failed its tests was still
# published as :latest, and anyone running the documented update command pulled
# it. (The release trigger never fired: releases are created with the workflow
# token, which does not start other workflows.)
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/2gt-media-group-llc/mikrotik-manager-backend
  NGINX_IMAGE: ghcr.io/2gt-media-group-llc/mikrotik-manager-nginx

jobs:
  publish-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign proves the image came from this workflow.
      id-token: write

    steps:
      - name: Checkout the commit CI tested
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # :latest only moves if this commit is still the tip of main, so a slow
      # CI run for an older commit can't publish over a newer one. Every build
      # also gets its version tag (e.g. 0.24.37-beta), which can be pinned.
      - name: Work out tags
        id: tags
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "version=$(node -p "require('./backend/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          TIP=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)
          if [ "$TIP" = "$SHA" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"; else echo "latest=false" >> "$GITHUB_OUTPUT"; fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ steps.tags.outputs.latest }}
            type=raw,value=${{ steps.tags.outputs.version }}
            type=raw,value=sha-${{ steps.tags.outputs.short }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # An SBOM and build provenance attached to the image (outside review O2).
          sbom: true
          provenance: mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signed by digest, so a tag moved later can't borrow the signature.
      # Verify with:
      #   cosign verify ghcr.io/2gt-media-group-llc/mikrotik-manager-backend@<digest> \
      #     --certificate-identity-regexp 'https://github.com/2GT-Media-Group-LLC/mikrotik-manager/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${{ env.BACKEND_IMAGE }}@${DIGEST}"

  publish-nginx:
    name: Build & Push Nginx (Frontend)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign proves the image came from this workflow.
      id-token: write

    steps:
      - name: Checkout the commit CI tested
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # :latest only moves if this commit is still the tip of main, so a slow
      # CI run for an older commit can't publish over a newer one. Every build
      # also gets its version tag (e.g. 0.24.37-beta), which can be pinned.
      - name: Work out tags
        id: tags
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "version=$(node -p "require('./backend/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          TIP=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)
          if [ "$TIP" = "$SHA" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"; else echo "latest=false" >> "$GITHUB_OUTPUT"; fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.NGINX_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ steps.tags.outputs.latest }}
            type=raw,value=${{ steps.tags.outputs.version }}
            type=raw,value=sha-${{ steps.tags.outputs.short }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: nginx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # An SBOM and build provenance attached to the image (outside review O2).
          sbom: true
          provenance: mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signed by digest, so a tag moved later can't borrow the signature.
      # Verify with:
      #   cosign verify ghcr.io/2gt-media-group-llc/mikrotik-manager-nginx@<digest> \
      #     --certificate-identity-regexp 'https://github.com/2GT-Media-Group-LLC/mikrotik-manager/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${{ env.NGINX_IMAGE }}@${DIGEST}"
