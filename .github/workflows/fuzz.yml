name: Fuzz

# Longer fuzzing than CI has time for. CI runs every property test with a few
# hundred cases; this runs them with tens of thousands, each run from a new
# random seed, and adds coverage-guided fuzzing (Jazzer.js) of the parsers that
# read what devices and the network send: the NetFlow/IPFIX decoder and the
# firewall log parser. A failure prints the seed (property tests) or uploads
# the input (Jazzer.js) that reproduces it; see CONTRIBUTING.md.
on:
  schedule:
    - cron: '17 6 * * 0' # Sundays, 06:17 UTC
  workflow_dispatch:
    inputs:
      runs:
        description: Cases per property test
        default: '20000'
      seconds:
        description: Seconds per Jazzer.js target
        default: '600'

permissions:
  contents: read

jobs:
  properties:
    name: Property tests, many cases
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
        env:
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: mtm_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FUZZ_RUNS: ${{ github.event.inputs.runs || '20000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend
        working-directory: backend
        run: |
          npm ci
          npx jest --runInBand "fuzz\.(pg\.)?test\.ts$"
        env:
          PG_E2E_URL: postgres://postgres:e2e@localhost:5432/mtm_e2e
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npx vitest run fuzz

  jazzer:
    name: Coverage-guided (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [netflow, firewall-log]
    env:
      FUZZ_SECONDS: ${{ github.event.inputs.seconds || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            fuzz/package-lock.json
      - name: Build the backend
        working-directory: backend
        run: |
          npm ci
          npm run build
      - name: Fuzz
        working-directory: fuzz
        run: |
          npm ci
          npm run seed
          npm run ${{ matrix.target }}
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-failure
          path: |
            fuzz/crash-*
            fuzz/timeout-*
            fuzz/oom-*
            fuzz/slow-unit-*
          if-no-files-found: ignore
