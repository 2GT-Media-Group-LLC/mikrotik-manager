server {
    listen 8080;
    server_name _;

    include /etc/nginx/static-app.conf;

    # The Gateway routes these to the backend, so they never arrive here.
    location ^~ /api/ { return 404; }
    location = /api { return 404; }
    location ^~ /socket.io/ { return 404; }
    location ^~ /.well-known/ { return 404; }
}
