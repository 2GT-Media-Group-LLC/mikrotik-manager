# LimitOnly keeps the 20 GB restore streaming and WebSocket upgrades working.
# It requires Envoy Gateway v1.10+; do not use BufferAndLimit on /socket.io.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: mikrotik-manager
  labels:
    app.kubernetes.io/name: mikrotik-manager
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mikrotik-manager
  requestBuffer:
    mode: LimitOnly
    limit: 20Gi
  timeout:
    http:
      streamIdleTimeout: 1h
