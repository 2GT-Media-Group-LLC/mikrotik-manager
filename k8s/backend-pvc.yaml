# Generated secrets and the local backup store. The backend runs one replica
# with the Recreate strategy, so ReadWriteOnce is enough.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mikrotik-manager-data
  labels:
    app.kubernetes.io/name: mikrotik-manager
    app.kubernetes.io/component: backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mikrotik-manager-backups
  labels:
    app.kubernetes.io/name: mikrotik-manager
    app.kubernetes.io/component: backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
