# ─────────────────────────────────────────────────────────────────────────────
# GENERATED FILE — DO NOT EDIT.
#
# Produced from docker-compose.yml by scripts/generate-ghcr-compose.mjs.
# Edit that file and run `npm run compose:generate`; CI fails if this one is
# out of date.
#
# Pre-built image deployment — no source code or build toolchain required.
# For development or building from source, use docker-compose.yml instead.
# ─────────────────────────────────────────────────────────────────────────────
# Every service's logs rotate (outside review O4): json-file logs otherwise
# grow until the disk fills.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  nginx:
    image: ghcr.io/2gt-media-group-llc/mikrotik-manager-nginx:${MTM_TAG:-latest}
    ports:
      # BIND_ADDRESS limits the web UI to one host address (e.g. a LAN or VPN
      # address). Unset, it listens on every interface, IPv4 and IPv6. Docker
      # publishes ports ahead of ufw/firewalld, so a host firewall alone does not
      # close them; see docs/configuration.md#network-exposure.
      - "${BIND_ADDRESS:+${BIND_ADDRESS}:}${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:+${BIND_ADDRESS}:}${HTTPS_PORT:-443}:443"
    environment:
      # The redirect from HTTP keeps a non-default HTTPS port (outside review O5).
      HTTPS_PORT: ${HTTPS_PORT:-443}
      # Behind your own reverse proxy that terminates TLS (#256): TLS_MODE=proxy
      # serves the app over plain HTTP on HTTP_PORT, and TRUSTED_PROXIES names the
      # proxy (address or CIDR) whose X-Forwarded-For / -Proto are believed.
      TLS_MODE: ${TLS_MODE:-https}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Optional HTTP-01 Let's Encrypt support; requires public DNS and port 80.
      ACME_DOMAIN: ${ACME_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # Override the ACME directory for a staging or private CA.
      ACME_SERVER: ${ACME_SERVER:-}
    volumes:
      - certs_data:/certs
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    # Hardening (outside review O4): only the capabilities nginx and its
    # entrypoint use (binding 80/443, dropping to the worker user, handing
    # /certs to the backend user), and a read-only root filesystem with
    # scratch space in memory.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks:
      - app-network

  backend:
    image: ghcr.io/2gt-media-group-llc/mikrotik-manager-backend:${MTM_TAG:-latest}
    environment: &backend-environment
      NODE_ENV: production
      TZ: ${TZ:-UTC}
      # The password is passed on its own, so any characters work in it (O3).
      DATABASE_URL: postgresql://mikrotik@postgres:5432/mikrotik_manager
      DB_PASSWORD: ${DB_PASSWORD:-mikrotik_secure_pw}
      REDIS_URL: redis://redis:6379
      # Optional. Set it in .env and Redis requires it; see docs/configuration.md.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-mytoken123456789}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-mikrotik-manager}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-metrics}
      # Leave unset to auto-generate & persist strong secrets on first boot
      # (stored in the app_data volume). Set them to pin your own values.
      JWT_SECRET: ${JWT_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # The outgoing key while ENCRYPTION_KEY is changed; see docs/configuration.md#key-rotation.
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://localhost,http://localhost,https://127.0.0.1,http://127.0.0.1}
      # false = SSO-only: no username/password on the login page (#226). Takes
      # effect only while SSO is configured; set it back to true to get in if
      # SSO breaks. See docs/sso-oidc.md.
      PASSWORD_LOGIN: ${PASSWORD_LOGIN:-true}
      # ACME defaults are read by the admin UI when no web override is saved.
      ACME_DOMAIN: ${ACME_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_SERVER: ${ACME_SERVER:-}
      PORT: 3001
      NETFLOW_BIND_PORT: 2055
      # Poller tuning. These were documented in .env.example but never passed
      # through, so setting them had no effect on the container at all.
      POLLER_CONCURRENCY: ${POLLER_CONCURRENCY:-12}
      POLLER_JOB_TIMEOUT_MS: ${POLLER_JOB_TIMEOUT_MS:-45000}
      POLLER_INTERVAL_MS: ${POLLER_INTERVAL_MS:-10000}
      POLLER_JOB_RETENTION_SEC: ${POLLER_JOB_RETENTION_SEC:-3600}
      POLLER_JOB_RETENTION_COUNT: ${POLLER_JOB_RETENTION_COUNT:-5000}
      # all (default): API, schedule and poll workers. api: leave polling to
      # poller containers. See docs/scaling.md#more-workers (#301).
      POLLER_ROLE: ${POLLER_ROLE:-all}
    ports:
      # NetFlow/IPFIX collector — UDP goes straight to the backend (nginx not involved).
      # Host port must match the netflow_collector_port app setting (default 2055).
      # NETFLOW_BIND_ADDRESS limits it to one host address; unset, every interface.
      - "${NETFLOW_BIND_ADDRESS:+${NETFLOW_BIND_ADDRESS}:}${NETFLOW_PORT:-2055}:2055/udp"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    volumes:
      - backups_data:/app/backups
      - certs_data:/certs
      - app_data:/app/data
    # Hardening (outside review O4): every capability dropped but NET_RAW,
    # which arp-scan needs, and a read-only root filesystem: the process can
    # write only its volumes and /tmp, so it can't rewrite its own code.
    # no-new-privileges is deliberately not set here: it would stop arp-scan
    # receiving its file capability, and with it server-side ARP discovery.
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-network
      - data-network
      - device-ipv6
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Extra poll workers for a large fleet (#301). Off unless asked for:
  #   docker compose --profile workers up -d --scale poller=3
  # Each runs POLLER_CONCURRENCY polls at once alongside the backend's own.
  # The backend keeps the schedule, the API and every other timer; set
  # POLLER_ROLE=api on it to leave all polling to these. See docs/scaling.md.
  poller:
    image: ghcr.io/2gt-media-group-llc/mikrotik-manager-backend:${MTM_TAG:-latest}
    profiles: ["workers"]
    environment:
      <<: *backend-environment
      POLLER_ROLE: worker
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # The secrets the backend generated (encryption key for device logins).
      - app_data:/app/data:ro
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-network
      - data-network
      - device-ipv6
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:15-alpine@sha256:aae6554de426ae1990f1a939ff183a0299146cf7142a6f4c379c3357af9cc2d8
    # Docker's default /dev/shm is 64 MB. Postgres puts parallel query and
    # parallel VACUUM workspace there, and on a large events table those fail
    # with "could not resize shared memory segment ... No space left on device".
    shm_size: 256m
    # Time for a clean shutdown (a checkpoint) before Docker kills it. The
    # default is 10 seconds, and an update that changes the image stops it.
    stop_grace_period: 60s
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_DB: mikrotik_manager
      POSTGRES_USER: mikrotik
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mikrotik_secure_pw}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    # No service sets no-new-privileges. On Ubuntu with AppArmor it makes the
    # container's first exec fail ("exec /usr/local/bin/docker-entrypoint.sh:
    # operation not permitted"), because entering Docker's AppArmor profile
    # counts as gaining a privilege. 0.24.51 set it and the stack wouldn't
    # start on Ubuntu 26.04 / Docker 29 (Discussion #85).
    networks:
      - data-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mikrotik -d mikrotik_manager"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    # A memory ceiling so a runaway producer can never take the host down, with
    # eviction disabled.
    #
    # volatile-lru looks tempting — it would evict only keys with an expiry, and
    # BullMQ's job hashes have none. But its *control* keys do: job locks and
    # per-queue stalled-check markers both carry TTLs, and losing one causes
    # duplicate processing or a stalled-job storm. BullMQ warns about this on
    # connect, and it is right. noeviction means Redis refuses writes when full
    # rather than quietly corrupting queue state: the host stays up, and the
    # failure is loud. Retention limits and the stale-pending sweep are what keep
    # us away from the ceiling in the first place.
    #
    # Before starting, the append-only file is checked, and repaired if it's
    # damaged. Redis refuses to start on a damaged one, and the whole stack waits
    # on Redis, so one bad patch in it kept everything down: a production install
    # read back 80 bytes of zeros from its disk in the middle of the file, ran on
    # for 20 hours without noticing (Redis reads the file only at start), and
    # then wouldn't start after an update restarted it. Redis holds only the job
    # queue, which refills itself, so the repair (Redis's own redis-check-aof,
    # which cuts the file at the last good record) costs at most queued jobs. A
    # copy of the damaged files is kept beside them, the newest two.
    #
    # The password and memory limit reach the script as variables, never pasted
    # into it, so a password with quotes or $ in it can't break it. The image's
    # own entrypoint still starts Redis: it fixes ownership and drops root.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-512mb}
    command:
      - sh
      - -c
      - |
        m=/data/appendonlydir/appendonly.aof.manifest
        if [ -f "$$m" ] && ! redis-check-aof "$$m" >/dev/null 2>&1; then
          keep="/data/appendonlydir.damaged-$$(date -u +%Y%m%dT%H%M%SZ)"
          cp -a /data/appendonlydir "$$keep"
          ls -d /data/appendonlydir.damaged-* | sort -r | tail -n +3 | while read -r old; do rm -rf "$$old"; done
          if echo y | redis-check-aof --fix "$$m" >/dev/null 2>&1; then
            echo "[mtm] Redis's append-only file was damaged. It was repaired by cutting it at the last good record; queued jobs after that point are lost and will be queued again. The damaged copy is in $$keep."
          else
            echo "[mtm] Redis's append-only file is damaged and couldn't be repaired. The damaged copy is in $$keep."
          fi
        fi
        set -- redis-server --appendonly yes --maxmemory "$$REDIS_MAXMEMORY" --maxmemory-policy noeviction
        if [ -n "$$REDIS_PASSWORD" ]; then set -- "$$@" --requirepass "$$REDIS_PASSWORD"; fi
        exec docker-entrypoint.sh "$$@"
    # Time to finish writing on the way down before Docker kills it. The default
    # is 10 seconds, and an update that changes the image stops it.
    stop_grace_period: 60s
    volumes:
      - redis_data:/data
    restart: unless-stopped
    logging: *default-logging
    networks:
      - data-network
    healthcheck:
      # The password from the container's environment, through REDISCLI_AUTH:
      # pasted into the command, one with quotes or $ in it broke the check.
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then export REDISCLI_AUTH=\"$$REDIS_PASSWORD\"; fi; redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7@sha256:b8d940ca9376f85118260f5b6bd236b8a00b1749c3350c5578d4cde8e27f31f2
    # Time to flush its write-ahead log before Docker kills it, as for Postgres.
    stop_grace_period: 60s
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:-admin_password_123}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-mikrotik-manager}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-metrics}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-mytoken123456789}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped
    logging: *default-logging
    networks:
      - data-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  influxdb_data:
  backups_data:
  certs_data:
  app_data:

networks:
  app-network:
    driver: bridge
  # The databases, with no route out and nothing but the backend on it
  # (outside review O3). nginx, on app-network, can't reach them.
  data-network:
    driver: bridge
    internal: true
  # Lets the backend reach devices by IPv6 address (#178). Off unless
  # ENABLE_IPV6=true is set in .env; see docs/devices.md for what the host needs
  # (IPv6, Docker 27+, accept_ra=2) and how to switch it on or off.
  # Only the backend joins it. app-network is deliberately left alone: changing
  # it in place reattaches running containers without their service names.
  device-ipv6:
    driver: bridge
    enable_ipv6: ${ENABLE_IPV6:-false}
