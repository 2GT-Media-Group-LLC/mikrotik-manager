# GENERATED FILE — DO NOT EDIT.
#
# Produced from docker-compose.yml by scripts/generate-ghcr-compose.mjs.
# Edit that file and run `npm run compose:generate`; CI fails if this one is
# out of date.
#
# Pre-built image deployment — no source code or build toolchain required.
# For development or building from source, use docker-compose.yml instead.
# ─────────────────────────────────────────────────────────────────────────────
# Every service's logs rotate (outside review O4): json-file logs otherwise
# grow until the disk fills.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  nginx:
    image: ghcr.io/2gt-media-group-llc/mikrotik-manager-nginx:latest
    ports:
      # BIND_ADDRESS limits the web UI to one host address (e.g. a LAN or VPN
      # address). Unset, it listens on every interface, IPv4 and IPv6. Docker
      # publishes ports ahead of ufw/firewalld, so a host firewall alone does not
      # close them; see docs/configuration.md#network-exposure.
      - "${BIND_ADDRESS:+${BIND_ADDRESS}:}${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:+${BIND_ADDRESS}:}${HTTPS_PORT:-443}:443"
    environment:
      # The redirect from HTTP keeps a non-default HTTPS port (outside review O5).
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - certs_data:/certs
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    # Hardening (outside review O4): only the capabilities nginx and its
    # entrypoint use (binding 80/443, dropping to the worker user, handing
    # /certs to the backend user), and a read-only root filesystem with
    # scratch space in memory.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks:
      - app-network

  backend:
    image: ghcr.io/2gt-media-group-llc/mikrotik-manager-backend:latest
    environment:
      NODE_ENV: production
      TZ: ${TZ:-UTC}
      # The password is passed on its own, so any characters work in it (O3).
      DATABASE_URL: postgresql://mikrotik@postgres:5432/mikrotik_manager
      DB_PASSWORD: ${DB_PASSWORD:-mikrotik_secure_pw}
      REDIS_URL: redis://redis:6379
      # Optional. Set it in .env and Redis requires it; see docs/configuration.md.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-mytoken123456789}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-mikrotik-manager}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-metrics}
      # Leave unset to auto-generate & persist strong secrets on first boot
      # (stored in the app_data volume). Set them to pin your own values.
      JWT_SECRET: ${JWT_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # The outgoing key while ENCRYPTION_KEY is changed; see docs/configuration.md#key-rotation.
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://localhost,http://localhost,https://127.0.0.1,http://127.0.0.1}
      PORT: 3001
      NETFLOW_BIND_PORT: 2055
      # Poller tuning. These were documented in .env.example but never passed
      # through, so setting them had no effect on the container at all.
      POLLER_CONCURRENCY: ${POLLER_CONCURRENCY:-12}
      POLLER_JOB_TIMEOUT_MS: ${POLLER_JOB_TIMEOUT_MS:-45000}
      POLLER_INTERVAL_MS: ${POLLER_INTERVAL_MS:-30000}
      POLLER_JOB_RETENTION_SEC: ${POLLER_JOB_RETENTION_SEC:-3600}
      POLLER_JOB_RETENTION_COUNT: ${POLLER_JOB_RETENTION_COUNT:-5000}
    ports:
      # NetFlow/IPFIX collector — UDP goes straight to the backend (nginx not involved).
      # Host port must match the netflow_collector_port app setting (default 2055).
      # NETFLOW_BIND_ADDRESS limits it to one host address; unset, every interface.
      - "${NETFLOW_BIND_ADDRESS:+${NETFLOW_BIND_ADDRESS}:}${NETFLOW_PORT:-2055}:2055/udp"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    volumes:
      - backups_data:/app/backups
      - certs_data:/certs
      - app_data:/app/data
    # Hardening (outside review O4): every capability dropped but NET_RAW,
    # which arp-scan needs, and a read-only root filesystem: the process can
    # write only its volumes and /tmp, so it can't rewrite its own code.
    # no-new-privileges is deliberately not set here: it would stop arp-scan
    # receiving its file capability, and with it server-side ARP discovery.
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-network
      - data-network
      - device-ipv6
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_DB: mikrotik_manager
      POSTGRES_USER: mikrotik
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mikrotik_secure_pw}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    # No service sets no-new-privileges. On Ubuntu with AppArmor it makes the
    # container's first exec fail ("exec /usr/local/bin/docker-entrypoint.sh:
    # operation not permitted"), because entering Docker's AppArmor profile
    # counts as gaining a privilege. 0.24.51 set it and the stack wouldn't
    # start on Ubuntu 26.04 / Docker 29 (Discussion #85).
    networks:
      - data-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mikrotik -d mikrotik_manager"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # A memory ceiling so a runaway producer can never take the host down, with
    # eviction disabled.
    #
    # volatile-lru looks tempting — it would evict only keys with an expiry, and
    # BullMQ's job hashes have none. But its *control* keys do: job locks and
    # per-queue stalled-check markers both carry TTLs, and losing one causes
    # duplicate processing or a stalled-job storm. BullMQ warns about this on
    # connect, and it is right. noeviction means Redis refuses writes when full
    # rather than quietly corrupting queue state: the host stays up, and the
    # failure is loud. Retention limits and the stale-pending sweep are what keep
    # us away from the ceiling in the first place.
    command: >
      redis-server --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy noeviction
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    logging: *default-logging
    networks:
      - data-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning ${REDIS_PASSWORD:+-a ${REDIS_PASSWORD}} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7@sha256:b8d940ca9376f85118260f5b6bd236b8a00b1749c3350c5578d4cde8e27f31f2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:-admin_password_123}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-mikrotik-manager}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-metrics}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-mytoken123456789}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped
    logging: *default-logging
    networks:
      - data-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  influxdb_data:
  backups_data:
  certs_data:
  app_data:

networks:
  app-network:
    driver: bridge
  # The databases, with no route out and nothing but the backend on it
  # (outside review O3). nginx, on app-network, can't reach them.
  data-network:
    driver: bridge
    internal: true
  # Lets the backend reach devices by IPv6 address (#178). Off unless
  # ENABLE_IPV6=true is set in .env; see docs/devices.md for what the host needs
  # (IPv6, Docker 27+, accept_ra=2) and how to switch it on or off.
  # Only the backend joins it. app-network is deliberately left alone: changing
  # it in place reattaches running containers without their service names.
  device-ipv6:
    driver: bridge
    enable_ipv6: ${ENABLE_IPV6:-false}
